name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: nothing here writes to the repository or publishes anything.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test (${{ matrix.os }}, tree-sitter=${{ matrix.tree-sitter }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        tree-sitter: [all, none]
    steps:
      # F7 (round 2): third-party actions pinned by commit SHA, not a mutable
      # tag — this workflow runs with the job token, so a compromised tag
      # would run as CI. Comment names the tag the SHA resolves to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          cache-key: ${{ matrix.os }}-${{ matrix.tree-sitter }}

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dtree-sitter=${{ matrix.tree-sitter }}

      # `test` already depends on the differ step (see build.zig); run differ by
      # name too so its result is visible as its own step, not folded into test.
      - name: Test
        run: zig build test -Dtree-sitter=${{ matrix.tree-sitter }} --summary all

      - name: Backend differ
        if: matrix.tree-sitter != 'none'
        run: zig build differ -Dtree-sitter=${{ matrix.tree-sitter }} --summary all

      # Every differ case skips without a grammar. Run it anyway so the suite
      # still has to compile in that configuration — it is not backend coverage.
      - name: Backend differ compiles with no grammar linked
        if: matrix.tree-sitter == 'none'
        run: zig build differ -Dtree-sitter=none --summary all
