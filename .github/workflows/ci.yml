name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: ${{ matrix.os }}

      # ReleaseFast is what the editor server ships as, and it is the mode the
      # performance numbers in docs/lsp.md were measured in.
      - name: Build
        run: zig build -Doptimize=ReleaseFast

      - name: Test
        run: zig build test --summary all

      # The server owns stdout: anything else printed there corrupts the
      # protocol stream. The driver replays a hostile session into the shipped
      # ReleaseFast binary — a 20k-deep regex, an ordinary pattern over a 300k
      # character line, a malformed header with a body — and then checks that
      # stdout is an exact frame stream ending at EOF, that the requests behind
      # each of those were answered, that navgraph/blast returned its own
      # result shape, and that the process exited 0.
      - name: Editor server speaks the protocol
        run: zig build smoke -Doptimize=ReleaseFast
