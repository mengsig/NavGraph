<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NavGraph — code graph</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22ee; --border: #30363d; --fg: #e6edf3;
    --muted: #8b949e; --accent: #58a6ff; --edge: #6e768166; --edge-out: #f0883e;
    --edge-in: #3fb950; --dim: 0.08;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    color: var(--fg); font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: grab; }
  #c.grabbing { cursor: grabbing; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; backdrop-filter: blur(8px); box-shadow: 0 6px 24px #0008; }
  #controls { top: 12px; left: 12px; width: 248px; padding: 12px 14px; }
  #controls h1 { margin: 0 0 2px; font-size: 14px; letter-spacing: .2px; }
  #controls h1 span { color: var(--accent); }
  #sub { color: var(--muted); font-size: 11px; margin-bottom: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #search { width: 100%; padding: 6px 8px; background: #0d1117; color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px; outline: none; margin-bottom: 10px; }
  #search:focus { border-color: var(--accent); }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 7px 0; gap: 8px; }
  .row label { color: var(--muted); user-select: none; }
  .check { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--fg); }
  .check input { accent-color: var(--accent); }
  select, .btn { background: #0d1117; color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font: inherit; cursor: pointer; }
  input[type=range] { width: 118px; accent-color: var(--accent); }
  .btns { display: flex; gap: 6px; margin-top: 10px; }
  .btn { flex: 1; text-align: center; }
  .btn:hover, select:hover { border-color: var(--accent); }
  #legend { top: 12px; right: 12px; width: 210px; max-height: 46vh; overflow-y: auto; padding: 10px 12px; }
  #legend .lg-h { display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 8px; color: var(--muted); }
  #legend .lg-h b { color: var(--fg); font-weight: 600; }
  .lg-item { display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer;
    white-space: nowrap; overflow: hidden; }
  .lg-item:hover { color: #fff; }
  .lg-item.off { opacity: .35; }
  .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }
  .lg-item .nm { overflow: hidden; text-overflow: ellipsis; }
  .lg-item .ct { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
  #status { bottom: 12px; left: 12px; padding: 8px 12px; color: var(--muted);
    font-variant-numeric: tabular-nums; max-width: 60vw; }
  #status b { color: var(--fg); }
  #tip { position: fixed; pointer-events: none; z-index: 20; background: #1c2128f2;
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; max-width: 340px;
    box-shadow: 0 4px 16px #000a; display: none; }
  #tip .t-name { font-weight: 600; }
  #tip .t-kind { color: var(--accent); font-size: 11px; }
  #tip .t-meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
  #hint { bottom: 12px; right: 12px; padding: 7px 11px; color: var(--muted); font-size: 11px; }
  #empty { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    color: var(--muted); flex-direction: column; gap: 8px; text-align: center; }
  kbd { background: #0d1117; border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 5px; font: 11px ui-monospace, monospace; color: var(--fg); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="controls" class="panel">
  <h1>Nav<span>Graph</span></h1>
  <div id="sub">—</div>
  <input id="search" type="search" placeholder="Search symbols…" autocomplete="off" spellcheck="false">
  <div class="row">
    <label for="layout">Layout</label>
    <select id="layout">
      <option value="layered">Layered (deps)</option>
      <option value="force">Force</option>
    </select>
  </div>
  <div class="row">
    <label for="colorby">Color by</label>
    <select id="colorby">
      <option value="file">File</option>
      <option value="lang">Language</option>
      <option value="kind">Kind</option>
    </select>
  </div>
  <label class="check"><input type="checkbox" id="hideTests" checked> Hide tests</label>
  <label class="check"><input type="checkbox" id="hideIso" checked> Hide isolated nodes</label>
  <div id="force-opts" style="display:none">
    <div class="row"><label for="dist">Spacing</label><input type="range" id="dist" min="20" max="140" value="52"></div>
    <div class="row"><label for="charge">Repulsion</label><input type="range" id="charge" min="200" max="4000" value="1200"></div>
  </div>
  <div class="btns">
    <button class="btn" id="fit">Fit</button>
    <button class="btn" id="reheat">Re-layout</button>
    <button class="btn" id="reset">Reset</button>
  </div>
</div>

<div id="legend" class="panel">
  <div class="lg-h"><b id="lg-title">Files</b><span id="lg-sub"></span></div>
  <div id="lg-list"></div>
</div>

<div id="status" class="panel"><b id="st-n">0</b> nodes · <b id="st-e">0</b> edges<span id="st-sel"></span></div>
<div id="hint" class="panel">drag node to pin · scroll to zoom · drag bg to pan · click to focus</div>
<div id="tip"><div class="t-name"></div><div class="t-kind"></div><div class="t-meta"></div></div>
<div id="empty"><div style="font-size:15px">No symbols to show.</div><div id="empty-sub"></div></div>

<script>
"use strict";
const DATA = /*__NAVGRAPH_DATA__*/;

// ---- palettes ------------------------------------------------------------
const KIND_COLORS = {
  fn: "#58a6ff", method: "#79c0ff", class: "#d2a8ff", struct: "#f0883e",
  enum: "#e3b341", iface: "#a5d6ff", type: "#ffa657", route: "#3fb950",
  test: "#8b949e", macro: "#db61a2", mod: "#56d364", const: "#bc8cff",
  var: "#7ee787", sym: "#6e7681",
};
const LANG_COLORS = {
  zig: "#f7a41d", py: "#3572A5", js: "#f1e05a", ts: "#3178c6", tsx: "#3178c6",
  go: "#00ADD8", rs: "#dea584", rb: "#701516", c: "#555555", cpp: "#f34b7d",
  cs: "#178600", lua: "#000080", "?": "#6e7681",
};
// distinct-ish color per file via the golden angle
function fileColor(i) { return `hsl(${(i * 137.508) % 360} 62% 62%)`; }

// ---- state ---------------------------------------------------------------
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let DPR = Math.min(window.devicePixelRatio || 1, 2);

const nodes = DATA.nodes.map((d, i) => ({
  i, name: d.n, kind: d.k, file: d.f, line: d.l,
  exported: !!d.e, test: !!d.t, deg: d.in + d.out, fin: d.in, fout: d.out,
  x: 0, y: 0, vx: 0, vy: 0, r: 3 + Math.sqrt(d.in) * 1.7, pinned: false, active: true,
}));
const edges = DATA.edges.map(e => ({ s: e.s, t: e.t, x: !!e.x }));

// adjacency for focus highlighting
const adj = nodes.map(() => new Set());
for (const e of edges) { adj[e.s].add(e.t); adj[e.t].add(e.s); }

// Force-mode seed: an even golden-angle disc so the simulation starts spread out.
function seedPositions() {
  const R = 30 + Math.sqrt(nodes.length) * 26;
  for (const n of nodes) {
    const a = n.i * 2.399963;
    const rr = R * Math.sqrt((n.i + 0.5) / nodes.length);
    n.x = Math.cos(a) * rr; n.y = Math.sin(a) * rr; n.vx = 0; n.vy = 0;
  }
}

const cam = { x: 0, y: 0, k: 1 };
let alpha = 1;
const params = { linkDist: 52, charge: 1200, gravity: 0.03, damping: 0.86 };
const MIN_D2 = 25;   // floor on squared distance so coincident nodes can't fling
const MAXV = 60;     // per-tick speed clamp — keeps the layout bounded
let autoFit = true;  // re-frame on settle until the user pans/zooms
const ui = {
  layout: "layered", colorby: "file", hideTests: true, hideIso: true,
  search: "", focus: null, groupOff: new Set(),
};
let hover = null;

// ---- colour + grouping ---------------------------------------------------
function groupKey(n) {
  return ui.colorby === "file" ? n.file : ui.colorby === "lang" ? DATA.files[n.file].lang : n.kind;
}
function groupColor(key) {
  if (ui.colorby === "file") return fileColor(key);
  if (ui.colorby === "lang") return LANG_COLORS[key] || "#8b949e";
  return KIND_COLORS[key] || "#8b949e";
}
function groupLabel(key) {
  return ui.colorby === "file" ? DATA.files[key].path : String(key);
}
function nodeColor(n) { return groupColor(groupKey(n)); }

// ---- active-set (what is shown) -----------------------------------------
function recomputeActive() {
  for (const n of nodes) {
    let a = true;
    if (ui.hideTests && n.test) a = false;
    if (ui.hideIso && n.deg === 0) a = false;
    if (ui.groupOff.has(groupKey(n))) a = false;
    n.active = a;
  }
  let vn = 0, ve = 0;
  for (const n of nodes) if (n.active) vn++;
  for (const e of edges) if (nodes[e.s].active && nodes[e.t].active) ve++;
  document.getElementById("st-n").textContent = vn;
  document.getElementById("st-e").textContent = ve;
  document.getElementById("empty").style.display = vn === 0 ? "flex" : "none";
}

// ---- layered (Sugiyama-style) dependency layout -------------------------
// Places callers above callees: nodes are ranked by longest path along the
// call graph (cycles broken via a DFS topo order), ordered within each rank by
// a barycenter crossing-reduction sweep, then laid out on a grid centered at
// the origin. Edges then flow downward = "depends on".
const LAYER_GAP = 96, NODE_GAP = 46;
function computeLayered() {
  const act = nodes.filter(n => n.active);
  if (!act.length) return;
  const actSet = new Set(act.map(n => n.i));
  const outAdj = new Map();
  for (const n of act) outAdj.set(n.i, []);
  for (const e of edges) {
    if (e.s !== e.t && actSet.has(e.s) && actSet.has(e.t)) outAdj.get(e.s).push(e.t);
  }
  // Iterative DFS → post-order; reverse = topological order (ignores back-edges).
  const state = new Map();          // 0 unvisited · 1 on-stack · 2 done
  for (const n of act) state.set(n.i, 0);
  const post = [];
  for (const root of act) {
    if (state.get(root.i) !== 0) continue;
    const stack = [[root.i, 0]];
    while (stack.length) {
      const top = stack[stack.length - 1];
      const u = top[0];
      if (top[1] === 0) state.set(u, 1);
      const kids = outAdj.get(u);
      if (top[1] < kids.length) {
        const v = kids[top[1]++];
        if (state.get(v) === 0) stack.push([v, 0]);
      } else { state.set(u, 2); post.push(u); stack.pop(); }
    }
  }
  const topoIdx = new Map();
  for (let k = post.length - 1, o = 0; k >= 0; k--, o++) topoIdx.set(post[k], o);
  // Longest-path ranking over forward edges only (guarantees a finite DAG rank).
  const rank = new Map();
  for (const n of act) rank.set(n.i, 0);
  const order = [...act].sort((a, b) => topoIdx.get(a.i) - topoIdx.get(b.i));
  const parents = new Map(), children = new Map();
  for (const n of act) { parents.set(n.i, []); children.set(n.i, []); }
  for (const n of order) {
    for (const v of outAdj.get(n.i)) {
      if (topoIdx.get(n.i) < topoIdx.get(v)) {
        if (rank.get(v) < rank.get(n.i) + 1) rank.set(v, rank.get(n.i) + 1);
        children.get(n.i).push(v); parents.get(v).push(n.i);
      }
    }
  }
  const L = Math.max(0, ...act.map(n => rank.get(n.i)));
  const layers = Array.from({ length: L + 1 }, () => []);
  for (const n of act) layers[rank.get(n.i)].push(n.i);
  // Crossing reduction: alternate down/up barycenter sweeps.
  const pos = new Map();
  layers.forEach(a => a.forEach((id, k) => pos.set(id, k)));
  const bary = (id, rel) => {
    const a = rel.get(id);
    if (!a.length) return pos.get(id);
    let s = 0; for (const j of a) s += pos.get(j); return s / a.length;
  };
  for (let sweep = 0; sweep < 8; sweep++) {
    const down = sweep % 2 === 0;
    for (let li = down ? 1 : L - 1; down ? li <= L : li >= 0; down ? li++ : li--) {
      const arr = layers[li];
      arr.sort((a, b) => bary(a, down ? parents : children) - bary(b, down ? parents : children));
      arr.forEach((id, k) => pos.set(id, k));
    }
  }
  // Assign coordinates, centered on the origin so fitView frames it.
  for (let li = 0; li <= L; li++) {
    const arr = layers[li], w = arr.length;
    for (let k = 0; k < w; k++) {
      const n = nodes[arr[k]];
      n.x = (k - (w - 1) / 2) * NODE_GAP;
      n.y = (li - L / 2) * LAYER_GAP;
      n.vx = 0; n.vy = 0;
    }
  }
}

// ---- force simulation (grid-accelerated repulsion) ----------------------
function tick() {
  const cell = Math.max(params.linkDist * 2, 24);
  const grid = new Map();
  const key = (cx, cy) => cx + "," + cy;
  for (const n of nodes) {
    if (!n.active) continue;
    const cx = Math.floor(n.x / cell), cy = Math.floor(n.y / cell);
    const k = key(cx, cy);
    let b = grid.get(k); if (!b) { b = []; grid.set(k, b); } b.push(n);
  }
  // repulsion within a 3x3 neighbourhood of cells
  const q = params.charge;
  for (const n of nodes) {
    if (!n.active) continue;
    const cx = Math.floor(n.x / cell), cy = Math.floor(n.y / cell);
    for (let gx = -1; gx <= 1; gx++) for (let gy = -1; gy <= 1; gy++) {
      const b = grid.get(key(cx + gx, cy + gy)); if (!b) continue;
      for (const m of b) {
        if (m === n) continue;
        let dx = n.x - m.x, dy = n.y - m.y;
        let d2 = dx * dx + dy * dy;
        if (d2 > cell * cell * 9) continue;
        if (d2 < 1e-4) { dx = (n.i % 7) - 3 + 0.5; dy = (m.i % 7) - 3 + 0.5; d2 = dx * dx + dy * dy; }
        const d2c = Math.max(d2, MIN_D2);   // clamp so overlap can't produce a huge kick
        const d = Math.sqrt(d2c);
        const f = q / d2c;
        n.vx += (dx / d) * f; n.vy += (dy / d) * f;
      }
    }
  }
  // spring attraction along edges
  const ld = params.linkDist;
  for (const e of edges) {
    const s = nodes[e.s], t = nodes[e.t];
    if (!s.active || !t.active) continue;
    const dx = t.x - s.x, dy = t.y - s.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const f = (d - ld) * 0.045;
    const fx = (dx / d) * f, fy = (dy / d) * f;
    s.vx += fx; s.vy += fy; t.vx -= fx; t.vy -= fy;
  }
  // gravity to the origin + integrate
  const g = params.gravity, damp = params.damping;
  for (const n of nodes) {
    if (!n.active || n.pinned) { n.vx = 0; n.vy = 0; continue; }
    n.vx -= n.x * g; n.vy -= n.y * g;
    const sp = Math.hypot(n.vx, n.vy);
    if (sp > MAXV) { n.vx = n.vx / sp * MAXV; n.vy = n.vy / sp * MAXV; }
    n.x += n.vx * alpha; n.y += n.vy * alpha;
    n.vx *= damp; n.vy *= damp;
  }
  alpha *= 0.985;
}

// ---- rendering -----------------------------------------------------------
function world(sx, sy) { return { x: (sx - cam.x) / cam.k, y: (sy - cam.y) / cam.k }; }
function screen(wx, wy) { return { x: wx * cam.k + cam.x, y: wy * cam.k + cam.y }; }

function focusSet() {
  if (ui.focus == null) return null;
  const s = new Set([ui.focus]); for (const j of adj[ui.focus]) s.add(j); return s;
}
function searchActive() { return ui.search.trim().length > 0; }
function matchesSearch(n) { return n.name.toLowerCase().includes(ui.search.trim().toLowerCase()); }

function draw() {
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.transform(cam.k, 0, 0, cam.k, cam.x, cam.y);

  const fset = focusSet();
  const searching = searchActive();

  // edges — straight in force mode, smooth downward curves in layered mode
  const curved = ui.layout === "layered";
  ctx.lineWidth = 1 / cam.k;
  for (const e of edges) {
    const s = nodes[e.s], t = nodes[e.t];
    if (!s.active || !t.active) continue;
    let col = "rgba(110,118,129,0.26)", strong = false;
    if (fset) {
      const inv = e.s === ui.focus || e.t === ui.focus;
      if (!inv) { if (!(fset.has(e.s) && fset.has(e.t))) continue; col = "rgba(110,118,129,0.08)"; }
      else { col = e.s === ui.focus ? "rgba(240,136,62,0.9)" : "rgba(63,185,80,0.85)"; strong = true; }
    } else if (searching) { col = "rgba(110,118,129,0.08)"; }
    ctx.strokeStyle = col;
    ctx.lineWidth = (strong ? 1.7 : 1) / cam.k;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    if (curved) {
      const my = (s.y + t.y) / 2;              // vertical S-curve → leaves/enters nodes vertically
      ctx.bezierCurveTo(s.x, my, t.x, my, t.x, t.y);
    } else {
      ctx.lineTo(t.x, t.y);
    }
    ctx.stroke();
  }

  // nodes
  for (const n of nodes) {
    if (!n.active) continue;
    let a = 1;
    if (fset && !fset.has(n.i)) a = 0.12;
    if (searching) a = matchesSearch(n) ? 1 : 0.09;
    ctx.globalAlpha = a;
    ctx.fillStyle = nodeColor(n);
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 6.2832); ctx.fill();
    if (n.exported && a > 0.5) {
      ctx.globalAlpha = a; ctx.lineWidth = 1.4 / cam.k; ctx.strokeStyle = "#ffffffcc";
      ctx.stroke();
    }
    if (n.pinned) {
      ctx.globalAlpha = a; ctx.lineWidth = 1.6 / cam.k; ctx.strokeStyle = "#f0883e";
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 2.5 / cam.k, 0, 6.2832); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // labels: hovered / focused / searched / high-degree / when zoomed in
  ctx.fillStyle = "#e6edf3";
  ctx.font = `${11 / cam.k}px ui-sans-serif, system-ui, sans-serif`;
  ctx.textBaseline = "middle";
  const zoomedIn = cam.k > 1.9;
  for (const n of nodes) {
    if (!n.active) continue;
    let show = zoomedIn || labelSet.has(n.i) || n.i === hover || n.i === ui.focus;
    if (fset && fset.has(n.i)) show = true;
    if (searching) show = matchesSearch(n);
    if (!show) continue;
    let a = 1;
    if (fset && !fset.has(n.i)) a = 0.0;
    if (searching && !matchesSearch(n)) a = 0.0;
    if (a === 0) continue;
    ctx.globalAlpha = (n.i === hover || n.i === ui.focus) ? 1 : 0.82;
    ctx.fillText(n.name, n.x + n.r + 2 / cam.k, n.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

let labelSet = new Set();
function computeLabelThreshold() {
  // Cap the always-on labels to the highest-degree hubs so dense areas stay legible;
  // everything else is labelled on hover/focus or when zoomed in.
  const act = nodes.filter(n => n.active).sort((a, b) => b.deg - a.deg);
  labelSet = new Set(act.slice(0, Math.min(18, act.length)).map(n => n.i));
}

// ---- main loop -----------------------------------------------------------
let running = false;   // is the force sim active? (never in layered mode)
let dirty = true;      // a redraw is pending
function frame() {
  if (running && ui.layout === "force") {
    tick();
    dirty = true;
    if (alpha < 0.02) { running = false; if (autoFit) fitView(); }
  }
  if (dirty) { draw(); dirty = false; }
  requestAnimationFrame(frame);
}
// Layered layout is static, so reheat is a no-op there — just request a redraw.
function reheat(a = 0.7) {
  dirty = true;
  if (ui.layout !== "force") return;
  alpha = Math.max(alpha, a); running = true;
}

// ---- camera / fit --------------------------------------------------------
function fitView() {
  const act = nodes.filter(n => n.active);
  if (!act.length) return;
  // Trim outliers (a couple of flung nodes shouldn't shrink the core to nothing).
  const xs = act.map(n => n.x).sort((a, b) => a - b);
  const ys = act.map(n => n.y).sort((a, b) => a - b);
  // The layered grid has no outliers, so use its full extent; force may fling a few.
  const q = (ui.layout === "force" && act.length >= 30) ? 0.02 : 0;
  const at = (arr, t) => arr[Math.floor(t * (arr.length - 1))];
  const minx = at(xs, q), maxx = at(xs, 1 - q), miny = at(ys, q), maxy = at(ys, 1 - q);
  // Inset the target box so the graph settles between the side panels, not under them.
  const W = cv.clientWidth, H = cv.clientHeight;
  const padL = 280, padR = 240, padT = 70, padB = 70;
  const availW = Math.max(W - padL - padR, 120), availH = Math.max(H - padT - padB, 120);
  const gw = Math.max(maxx - minx, 1), gh = Math.max(maxy - miny, 1);
  cam.k = Math.min(availW / gw, availH / gh, 2.5);
  cam.x = padL + availW / 2 - ((minx + maxx) / 2) * cam.k;
  cam.y = padT + availH / 2 - ((miny + maxy) / 2) * cam.k;
  dirty = true;
}

// ---- hit-testing ---------------------------------------------------------
function nodeAt(sx, sy) {
  const w = world(sx, sy);
  let best = null, bd = Infinity;
  for (const n of nodes) {
    if (!n.active) continue;
    const dx = n.x - w.x, dy = n.y - w.y, d = Math.sqrt(dx * dx + dy * dy);
    const rr = n.r + 4 / cam.k;
    if (d < rr && d < bd) { bd = d; best = n; }
  }
  return best;
}

// ---- interaction ---------------------------------------------------------
let drag = null, panning = false, last = null, moved = false;
cv.addEventListener("pointerdown", ev => {
  cv.setPointerCapture(ev.pointerId);
  moved = false; last = { x: ev.clientX, y: ev.clientY };
  const n = nodeAt(ev.clientX, ev.clientY);
  autoFit = false;
  if (n) { drag = n; if (ui.layout === "force") n.pinned = true; reheat(0.5); }
  else { panning = true; cv.classList.add("grabbing"); }
  dirty = true;
});
cv.addEventListener("pointermove", ev => {
  if (drag) {
    const w = world(ev.clientX, ev.clientY);
    drag.x = w.x; drag.y = w.y; drag.vx = 0; drag.vy = 0; reheat(0.3); moved = true; dirty = true;
    return;
  }
  if (panning) {
    cam.x += ev.clientX - last.x; cam.y += ev.clientY - last.y;
    last = { x: ev.clientX, y: ev.clientY }; moved = true; dirty = true; return;
  }
  const n = nodeAt(ev.clientX, ev.clientY);
  if ((n ? n.i : null) !== hover) dirty = true;
  hover = n ? n.i : null;
  showTip(n, ev.clientX, ev.clientY);
  cv.style.cursor = n ? "pointer" : "grab";
});
cv.addEventListener("pointerup", ev => {
  cv.classList.remove("grabbing");
  if (!moved) {
    const n = nodeAt(ev.clientX, ev.clientY);
    ui.focus = n ? (ui.focus === n.i ? null : n.i) : null;
    updateSel();
  }
  drag = null; panning = false; dirty = true;
});
cv.addEventListener("dblclick", ev => {
  const n = nodeAt(ev.clientX, ev.clientY);
  if (n) { n.pinned = false; reheat(0.4); }
});
cv.addEventListener("wheel", ev => {
  ev.preventDefault();
  autoFit = false;
  const f = Math.exp(-ev.deltaY * 0.0012);
  const w = world(ev.clientX, ev.clientY);
  cam.k = Math.min(Math.max(cam.k * f, 0.05), 8);
  cam.x = ev.clientX - w.x * cam.k; cam.y = ev.clientY - w.y * cam.k;
  dirty = true;
}, { passive: false });

function showTip(n, sx, sy) {
  const tip = document.getElementById("tip");
  if (!n) { tip.style.display = "none"; return; }
  tip.querySelector(".t-name").textContent = n.name;
  tip.querySelector(".t-kind").textContent = n.kind + (n.exported ? " · public" : "") + (n.test ? " · test" : "");
  tip.querySelector(".t-meta").textContent =
    `${DATA.files[n.file].path}:${n.line}  ·  ${n.fin} in / ${n.fout} out`;
  tip.style.display = "block";
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(sx + 14, window.innerWidth - tw - 8) + "px";
  tip.style.top = Math.min(sy + 14, window.innerHeight - th - 8) + "px";
}
function updateSel() {
  const el = document.getElementById("st-sel");
  if (ui.focus == null) { el.textContent = ""; return; }
  const n = nodes[ui.focus];
  el.textContent = `  ·  ${n.name} — ${n.fin} callers, ${n.fout} callees`;
}

// ---- legend --------------------------------------------------------------
function buildLegend() {
  const counts = new Map();
  for (const n of nodes) {
    if (ui.hideTests && n.test) continue;
    if (ui.hideIso && n.deg === 0) continue;
    const k = groupKey(n); counts.set(k, (counts.get(k) || 0) + 1);
  }
  const items = [...counts.entries()].sort((a, b) => b[1] - a[1]);
  document.getElementById("lg-title").textContent =
    ui.colorby === "file" ? "Files" : ui.colorby === "lang" ? "Languages" : "Kinds";
  document.getElementById("lg-sub").textContent = items.length + "";
  const list = document.getElementById("lg-list");
  list.innerHTML = "";
  for (const [k, c] of items) {
    const row = document.createElement("div");
    row.className = "lg-item" + (ui.groupOff.has(k) ? " off" : "");
    const label = groupLabel(k);
    row.innerHTML = `<span class="sw" style="background:${groupColor(k)}"></span>` +
      `<span class="nm" title="${label}">${shortLabel(label)}</span><span class="ct">${c}</span>`;
    row.onclick = () => {
      if (ui.groupOff.has(k)) ui.groupOff.delete(k); else ui.groupOff.add(k);
      recomputeActive(); computeLabelThreshold(); buildLegend(); relayout();
    };
    list.appendChild(row);
  }
}
function shortLabel(p) {
  if (ui.colorby !== "file") return p;
  const parts = p.split("/");
  return parts.length > 2 ? "…/" + parts.slice(-2).join("/") : p;
}

// ---- layout switching ----------------------------------------------------
// Establish the current layout from scratch (fresh force seed, or a rebuilt
// layered grid) and frame it.
function applyLayout(fresh) {
  document.getElementById("force-opts").style.display = ui.layout === "force" ? "" : "none";
  document.getElementById("hint").textContent = ui.layout === "layered"
    ? "top = callers · down = callees (depends-on) · scroll zoom · click to trace"
    : "drag node to pin · scroll to zoom · drag bg to pan · click to focus";
  if (ui.layout === "layered") { running = false; computeLayered(); }
  else { if (fresh) seedPositions(); reheat(1); }
  autoFit = true; computeLabelThreshold(); fitView(); dirty = true;
}
// Re-establish the layout after the active set changed (toggles/filters).
function relayout() {
  if (ui.layout === "layered") { computeLayered(); if (autoFit) fitView(); }
  else reheat(0.6);
  dirty = true;
}

// ---- controls wiring -----------------------------------------------------
document.getElementById("search").addEventListener("input", e => { ui.search = e.target.value; dirty = true; });
document.getElementById("layout").addEventListener("change", e => { ui.layout = e.target.value; applyLayout(true); });
document.getElementById("colorby").addEventListener("change", e => {
  ui.colorby = e.target.value; ui.groupOff.clear();
  recomputeActive(); computeLabelThreshold(); buildLegend(); relayout();
});
document.getElementById("hideTests").addEventListener("change", e => {
  ui.hideTests = e.target.checked; ui.groupOff.clear();
  recomputeActive(); computeLabelThreshold(); buildLegend(); relayout();
});
document.getElementById("hideIso").addEventListener("change", e => {
  ui.hideIso = e.target.checked; recomputeActive(); computeLabelThreshold(); buildLegend(); relayout();
});
document.getElementById("dist").addEventListener("input", e => { params.linkDist = +e.target.value; reheat(0.5); });
document.getElementById("charge").addEventListener("input", e => { params.charge = +e.target.value; reheat(0.5); });
document.getElementById("fit").onclick = () => { autoFit = true; fitView(); };
document.getElementById("reheat").onclick = () => {
  autoFit = true;
  if (ui.layout === "force") { for (const n of nodes) n.pinned = false; reheat(1); }
  else { computeLayered(); fitView(); dirty = true; }
};
document.getElementById("reset").onclick = () => {
  ui.focus = null; ui.search = ""; ui.groupOff.clear();
  document.getElementById("search").value = "";
  recomputeActive(); computeLabelThreshold(); buildLegend(); updateSel(); applyLayout(false);
};
window.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    ui.focus = null; updateSel();
    document.getElementById("search").value = ""; ui.search = ""; dirty = true;
  }
  if (e.key === "/" && document.activeElement.id !== "search") {
    e.preventDefault(); document.getElementById("search").focus();
  }
});

// ---- resize --------------------------------------------------------------
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = cv.clientWidth * DPR; cv.height = cv.clientHeight * DPR;
  if (autoFit) fitView();
  dirty = true;
}
window.addEventListener("resize", resize);

// ---- boot ----------------------------------------------------------------
function boot() {
  document.getElementById("sub").textContent =
    `${DATA.root}  ·  ${nodes.length} symbols, ${edges.length} edges`;
  document.getElementById("sub").title = DATA.root;
  document.getElementById("empty-sub").textContent =
    "Try toggling “Hide isolated”, or re-run with a wider --tests scope.";
  resize();
  recomputeActive();
  buildLegend();
  applyLayout(true);   // builds the default (layered) layout and frames it
  requestAnimationFrame(frame);
}
boot();
</script>
</body>
</html>
